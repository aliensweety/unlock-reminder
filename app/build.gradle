plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.suvye.unlockreminder'
    compileSdk 34

    defaultConfig {
        applicationId "com.suvye.unlockreminder"
        minSdk 27
        targetSdk 34
        versionCode 7
        versionName "0.5.1"
    }

    signingConfigs {
        release {
            storeFile file("keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "unlockreminder"
            keyAlias System.getenv("KEY_ALIAS") ?: "unlockreminder"
            keyPassword System.getenv("KEY_PASSWORD") ?: "unlockreminder"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig file("keystore.jks").exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
