name: build

on:
  push:
    branches: [ main, agy, grok ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Decode keystore from secret
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks

      - name: Generate keystore (first build only)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkeypair -v -keystore app/keystore.jks -alias unlockreminder \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass unlockreminder -keypass unlockreminder \
            -dname "CN=Unlock Reminder, OU=Personal, O=Personal, C=CN"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk unlock-reminder.apk
          ls -lh unlock-reminder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: unlock-reminder-apk
          path: unlock-reminder.apk

      - name: Upload generated keystore (for secret bootstrap)
        if: env.KEYSTORE_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: app/keystore.jks

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: unlock-reminder.apk
          body: 解锁提醒 · 覆盖安装即可更新（签名一致）
          fail_on_unmatched_files: true
